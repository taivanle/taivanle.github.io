name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: git diff --exit-code -- docs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test -- --reporter=line --grep 'landing Work → Themis → Escape stays dark'
      - run: npm test -- --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-failures
          path: test-results/
